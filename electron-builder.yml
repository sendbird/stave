appId: com.stave.app
productName: Stave
icon: build/icon
files:
  - out/**
  - package.json
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: NOTICE
    to: NOTICE
  # The PDF renderer is compiled into out/renderer. Include the upstream
  # license and the notices for the decoder/font assets selected by the viewer.
  - from: node_modules/pdfjs-dist
    to: licenses/pdfjs-dist
    filter:
      - LICENSE
      - cmaps/LICENSE
      - standard_fonts/LICENSE_FOXIT
      - wasm/LICENSE_JBIG2
      - wasm/LICENSE_OPENJPEG
      - wasm/LICENSE_PDFJS_JBIG2
      - wasm/LICENSE_PDFJS_OPENJPEG
directories:
  output: release
asar: true
asarUnpack:
  - "**/*.node"
  # The stdio proxy must be accessible on the real filesystem so that
  # external processes can execute it with `node`.
  - out/main/stave-mcp-stdio-proxy.mjs
  # Orbit resolves the bundled portless CLI under app.asar.unpacked before
  # falling back to a globally installed `portless`.
  - node_modules/portless/dist/**
  - node_modules/@anthropic-ai/claude-agent-sdk/vendor/**
  - node_modules/@vscode/ripgrep/bin/**
npmRebuild: false
linux:
  target:
    - AppImage
    - deb
  category: Development
win:
  target:
    - nsis
mac:
  target:
    - dmg
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    LSExtensionIsHidden: true
    NSMicrophoneUsageDescription: Stave uses the microphone when a page in Lens requests audio input.
