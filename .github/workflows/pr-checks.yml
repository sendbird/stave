name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run check:licenses
      - run: bun run check:reliability-gates
      - run: bun run check:doc-paths
      - run: bun run check:max-lines-ratchet
      - run: bun run check:switch-exhaustiveness
      - run: bun run typecheck
      - run: bun run typecheck:lens-main
      - run: bun run test:isolated
