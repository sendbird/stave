name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run check:licenses
      - run: bun run check:reliability-gates
      - run: bun run check:temporary-migrations
      - run: bun run check:i18n
      - run: bun run check:doc-paths
      - name: Reject spacing baseline growth
        run: bun scripts/check-spacing-baseline.mjs "${{ github.event.pull_request.base.sha }}"
      - run: bun run check:ui-layout
      - name: Build Pages site
        run: bun run build:pages
      - run: bun run check:max-lines-ratchet
      - run: bun run check:switch-exhaustiveness
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:lens-main
      - run: bun run test:isolated

  ui-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bunx --bun playwright install --with-deps chromium
      - run: bun run test:ui-layout
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-layout-failures
          path: test-results/
          retention-days: 7
