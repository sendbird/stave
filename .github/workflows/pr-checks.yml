name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run check:licenses
      - run: bun run check:reliability-gates
      - run: bun run check:temporary-migrations
      - run: bun run check:i18n
      - run: bun run check:doc-paths
      - name: Reject spacing baseline growth
        run: bun scripts/check-spacing-baseline.mjs "${{ github.event.pull_request.base.sha }}"
      - run: bun run check:ui-layout
      - name: Build Pages site
        run: bun run build:pages
      - run: bun run check:max-lines-ratchet
      - run: bun run check:switch-exhaustiveness
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run typecheck:lens-main
      - run: bun run test:isolated

  ui-layout:
    # Keep browser dependencies and font geometry on a stable OS baseline.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The layout suite runs one worker for stable geometry; four shards keep
    # each job within the timeout as layout regressions are added.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      # The hosted image supplies Chromium libraries; product fonts are bundled.
      # Browser launch still validates native dependencies during the tests.
      - run: bunx --bun playwright install chromium
      - run: bun run test:ui-layout --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-layout-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
